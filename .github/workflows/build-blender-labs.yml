name: Build Blender concept labs once
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-blender-labs]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Download verified Blender 5.2.1 LTS
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://download.blender.org/release/Blender5.2
          curl -fL "$BASE/blender-5.2.1-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          curl -fL "$BASE/blender-5.2.1.sha256" -o /tmp/blender.sha256
          EXPECTED=$(grep 'blender-5.2.1-linux-x64.tar.xz' /tmp/blender.sha256 | awk '{print $1}')
          test -n "$EXPECTED"
          echo "$EXPECTED  /tmp/blender.tar.xz" | sha256sum -c -
          tar -xf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.1-linux-x64/blender --version
      - name: Generate and reopen both labs
        shell: bash
        run: |
          set -euo pipefail
          BLENDER=/tmp/blender-5.2.1-linux-x64/blender
          "$BLENDER" --background --python blender/labs/build_labs.py -- --output-dir blender/labs 2>&1 | tee /tmp/blender_build.log
          grep -q 'BLENDER LAB BUILD PASS' /tmp/blender_build.log
          test -s blender/labs/transform_origin_lab.blend
          test -s blender/labs/kitbash_style_lab.blend
          "$BLENDER" --background blender/labs/transform_origin_lab.blend --python-expr "import bpy; assert bpy.data.objects.get('Door_Hinge'); print('TRANSFORM LAB OPEN PASS')" 2>&1 | tee /tmp/transform_open.log
          "$BLENDER" --background blender/labs/kitbash_style_lab.blend --python-expr "import bpy; assert bpy.data.objects.get('Variant_Roof'); print('KITBASH LAB OPEN PASS')" 2>&1 | tee /tmp/kitbash_open.log
          grep -q 'TRANSFORM LAB OPEN PASS' /tmp/transform_open.log
          grep -q 'KITBASH LAB OPEN PASS' /tmp/kitbash_open.log
      - name: Commit only generated blend files
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git status --porcelain | awk '{print $2}' | sort)
          test "$CHANGED" = $'blender/labs/kitbash_style_lab.blend\nblender/labs/transform_origin_lab.blend'
          ACTUAL=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$ACTUAL" = "$EXPECTED_HEAD" || { echo concurrent main change; exit 1; }
          git add blender/labs/kitbash_style_lab.blend blender/labs/transform_origin_lab.blend
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'blender: add reproducible concept lab files'
          git push origin HEAD:main
