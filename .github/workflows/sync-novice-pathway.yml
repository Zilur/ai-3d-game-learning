name: Publish novice learning pathway once
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[sync-novice-pathway]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Wire authoring layer and regenerate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/build_course_materials.py')
          text = p.read_text(encoding='utf-8')
          anchor = '    enrich_fixed_view_effects(output, by_id, ORDER, ROWS)\n'
          hook = "    runpy.run_path(str(AUTHOR / 'novice_learning.py'))['enrich_pathway'](output, by_id, ORDER)\n"
          if hook not in text:
              assert text.count(anchor) == 1, 'builder anchor changed'
              text = text.replace(anchor, anchor + hook, 1)
          text = text.replace("'version':'fixed-view-effects-2026-09-15','date':'2026-09-15'", "'version':'novice-learning-pathway-2026-09-16','date':'2026-09-16'", 1)
          p.write_text(text, encoding='utf-8')
          p = Path('.github/workflows/validate.yml')
          text = p.read_text(encoding='utf-8')
          anchor = '        run: python3 tools/validate_repo.py\n'
          step = '      - name: Validate learning pathway and evidence reports\n        run: python3 tools/check_learning_pathway.py\n'
          if step not in text:
              assert text.count(anchor) == 1, 'validation anchor changed'
              text = text.replace(anchor, anchor + step, 1)
          p.write_text(text, encoding='utf-8')
          p = Path('.gitignore')
          text = p.read_text(encoding='utf-8') if p.exists() else ''
          if '.learning/' not in text.splitlines():
              p.write_text(text + '\n# Private learner submissions, feedback and recordings\n.learning/\n', encoding='utf-8')
          p = Path('curriculum/lab-production-workflow.md')
          text = p.read_text(encoding='utf-8')
          note = '> 2026-09-16修订：详见[生产任务单](production-work-orders.md)。平台导出、性能基线和角色/动作兼容在风险首次出现时早做小试；P9/P10/P11是最终打磨、集成和交付，不是第一次验证。美术采纳分数不是学习及格线。\n\n'
          if note not in text:
              p.write_text(note + text, encoding='utf-8')
          PY
          python3 tools/build_course_materials.py
          python3 tools/validate_repo.py
          python3 tools/check_learning_pathway.py
          python3 tools/learning_review.py assessments/learning-report.example.json
      - name: Commit only authorized source wiring and generated output
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest = json.loads(Path('curriculum/materials-manifest.json').read_text())
          allowed = set(manifest['sha256']) | {'curriculum/materials-manifest.json', 'tools/build_course_materials.py', '.github/workflows/validate.yml', '.gitignore', 'curriculum/lab-production-workflow.md'}
          changed = set(subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0'))
          changed |= set(subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0'))
          changed.discard('')
          unexpected = changed - allowed
          assert not unexpected, repr(sorted(unexpected))
          assert not any(x.startswith(('game/','blender/','web/')) for x in changed), 'runtime change outside scope'
          if changed:
              subprocess.run(['git','add','--',*sorted(changed)], check=True)
          PY
          if git diff --cached --quiet; then exit 0; fi
          ACTUAL=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$ACTUAL" = "$EXPECTED_HEAD" || { echo 'Concurrent main change; no overwrite'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'curriculum: publish 47 Lab bindings, memory cards, diagnostic review and production pathway'
          git push origin HEAD:main
