name: Publish practical-stage authored pages
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: practical-stage-publication
  cancel-in-progress: false
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-practical-sync]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Make practical stage canonical and regenerate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  return
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {s.count(old)}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          practical = r'''PAGES = {
          'AGENTS.md': r"""# AI协作与课程维护约定

          唯一交付分支main。**用户已明确切换到实战工程阶段：现在允许扩写 `game/`，制作“星光小庭院”的固定/有限高角度风格化参考实现与视觉实验室。** 仍需保持课程源/生成物一致；`blender/`、`web/`按真实配套需求再扩。没有用户额外授权，不购买收费资源、不调用收费生成、不索取密钥；第三方资产进入仓库前必须核对许可与再分发边界。

          ## 唯一编号

          课程唯一编号由tools/course_order.py定义：A01–A08、B01–B13、C01–C12、D01–D07、E01–E07，共47课。ABCDE只是顺序分组，A最基础，不按软件含义归组。文件名、课内标题、前置、练习题号、对话启动框及索引必须一致。不再使用另一套展示号或兼容课号。

          作者源中的LESSONS、SCENARIOS、PLANS、REVIEWS和准备材料索引也使用同一课号，不保留一套隐藏旧课程ID。技术概念为KN01–KN32，艺术词用ART；不与C组课号混淆。旧版本映射只保留在docs/numbering-migration.md。

          ## 内容与生成

          curriculum/authoring/维护逐课正文、应用、对话、审核与准备材料；tools/build_course_materials.py生成学生稿、OpenMAIC全文和对话卡。先改源，再构建；不能只改生成MD。tools/numbered_navigation.py负责统一入口，不更改学习内容或评分。

          M/K描述限定能力，不把整个学科升级必修。API、菜单、快捷键可查；常用可见参数适合亲调但不以机械拖滑杆证明掌握。学生稿不得包含教师答案。没有过程证据，不将模拟或文字解释标成软件应用通过。

          起始材料缺失时明确分支，不让学员临时重建大工程。第一条提示必须自带首步、继续条件、下一步和结束证据；AI根据实际材料说明建议、执行、验证三个状态，不能假称已读电脑或保存进度。

          ## 校验

          运行python3 tools/build_course_materials.py --check、python3 tools/check_course_numbering.py和python3 tools/validate_repo.py。现有质量/准备/对话检查保留；结构检查不证明课堂、视觉或学习效果。运行代码另按实际固定版本验证，区分历史结果与新结果。

          `game/`修改必须在固定 Godot 版本上完成导入与 smoke/B02 回归；新增实战场景至少要能被导入并有最小行为验证。美术“更好看”必须另外做人眼/截图 A/B，不能由 headless 测试代替。

          openmaic/vendor是固定上游参考，保留原字节、许可证和摘要，不自动执行。参考链接、临摹、公开分发的条件分别核对；密钥、个人日志和未授权原作不进入公开仓库。

          ## 固定视角与套装二开基线

          本项目默认固定/有限镜头、干净的高角度风格化自然世界。当前最高权重参考是 Uncanyon《未境峡谷》、Tiny Delivery、Pioneers of Pagonia；只提炼构图、配色、材质、密度与镜头规则，不复制具体角色、资产或关卡。A08不恢复为自由Orbit主课；C01/C02按玩家镜头设计地图和世界；D01-D04以资产套装选择、拼装、二开、风格统一和复用为主；D05/D06以现成动作融合为主。不得把“原创”解释成必须从零建模/动画。

          **干净是硬约束：**缩到实际玩家画面，角色/主路/主要焦点必须先读到；植被和生活细节成簇，不平均铺满；背景主动降低对比/饱和/细节密度。

          ## 固定视角效果语言

          固定镜头不等于完全静止。可以用短促Camera impulse/Shake、透视FOV Pulse或正交Size Pulse强化重要事件，但必须恢复基线并提供低运动替代。C02负责视差/深度与固定视角画面语言，C08负责渲染/后处理边界，D06负责打击反馈分层。不得把所有效果同时开启当成高质量。

          ## 实战工程原则

          第一版先用 Godot 原生几何证明视觉规则：暖土主路、草地留白、模块小屋、树石花簇、受控色盘与柔和材质。之后购买/导入资产时每次只替换少量样本，固定机位 A/B，经过 Blender 二开和 Godot 回归再扩。

          AI实施遵循 [实战AI指挥手册](curriculum/ai-build-playbook.md)：一次只做局部可逆修改，列出修改范围、旧功能保持项、验证证据和未验证项。最终视觉选择、素材采购、是否采纳、回退和验收责任在人。
          """,
          'art/style-and-library.md': r"""# 快速而长期的风格化美术路线

          目标不是每件资产都从零建模，也不是把互不搭配的免费模型堆进场景。建议先定义风格，再找许可和结构合适的基底，做少量高收益改造，建立统一的小套件。以下是课程设计与操作计划，本轮还没有制作这些资产成品。

          ## 1. 一页风格卡

          当前最高权重参考：**Uncanyon《未境峡谷》、Tiny Delivery、Pioneers of Pagonia**。共同方向不是“纯Low Poly”或“玩具塑料”，而是**干净的高角度风格化自然世界**：自然尺度为基础，形体简化但不粗糙，颜色漂亮但受控，细节丰富但有大片呼吸空间。

          ```text
          主题：温暖、美好、干净的风格化自然小世界
          观察距离/相机：固定或有限的高角度/三分之四游戏机位，中远景优先
          形状：简化、顺眼、轮廓清楚；避免全场明显尖锐 faceted low-poly
          比例：自然尺度为基础，地标和交互对象可适度夸张
          色彩：受控自然色盘；大面积绿/土/石/木稳定，亮色只做少量强调
          光照：柔和自然主光，暗部可读，有清楚接触感；不靠全场发光制造“高级”
          表面：柔和PBR或轻手绘感；木、石、布能区分，但整体不过亮、不塑料
          植被：成簇、沿路径和边界组织；花草丰富但不要均匀铺满
          构图：一个主要焦点 + 少量次焦点 + 明确留白；缩小画面仍清楚
          不要：满场高饱和、每处都有细节、强噪声纹理、全材质同一高光、素材展台感
          保留：主路、角色、互动目标和地标优先可读
          来源：参考作品原链接；只提炼形状/色彩/光照/密度规则，不复制独特角色和具体设计
          ```

          **“干净”是当前硬约束。** 如果一张场景放大很好看、缩到真实游戏机位却变成一团，就不通过。减少无意义装饰、降低背景对比、让植被形成簇和留白，往往比继续加模型更接近目标。

          风格卡是可修改的设计决定，不是对某艺术家或儿童偏好的事实判断。每轮改卡后用一件样本验收，不立即全库批量重做。

          ## 2. 选择基底，先做四个判断

          能否按目的使用和修改；源文件是否可编辑；尺度/原点/拓扑是否够用；离目标风格还有多少差距。把修复成本与更换成本比较。复杂绑定坏资产不要求硬修，换一个更接近目标的资源可能更合理。

          额外增加一个本项目特有问题：**删掉商店Demo的灯光、后处理和专属Shader，只看网格+纹理，这个资产仍然值得买吗？** 如果答案是否定的，就不适合作为Godot里的主视觉母体。

          具体采购候选、当前价位和购买顺序见 [素材包采购指南](asset-pack-buying-guide.md)。

          ## 3. 三轮改造，只做可见收益

          **第一轮大形：** 看剪影与游戏大小，调比例、间隙和连接位置。先不画木纹和铆钉。

          **第二轮结构：** 检查厚度、开口、支点、拼接与实际用途；平滑/倒角只为解决观察到的问题。

          **第三轮表面：** 统一色盘、材质、有限边缘高光和细节密度。固定机位/光照A/B，再看游戏距离。看不到或不服务玩法的细节先停。

          当前项目再加一条：**每加一批细节，都做一次“缩小图检查”**。如果主路、角色和主要焦点变难读，优先删或降背景对比，而不是再加发光描边补救。

          始终保留基底只读副本和修改版本。不要把绑定角色的变换按静态道具的处理方式一键Apply；具体资产流程须另核对。

          ## 4. 六件资产先形成闭环

          示例套件：墙、门、窗、树、石头、灯。完成一件合格主资产，再从颜色、比例或少量结构做变体。缩略图用于浏览，不能替代源文件；游戏包装保留功能，源视觉资源可重新导入。

          每件最少记录：

          ```text
          asset_id / 名称 / 版本：
          用途与目标风格：
          作者与原链接 / 取得日期 / 许可原文位置：
          游戏使用、修改、公开源文件再分发：分别确认
          原始来源文件 / 可编辑主文件 / 交换文件：
          尺寸单位 / 原点 / 前向 / 连接规则：
          材质数 / 纹理尺寸 / 共享或独立范围：
          预览机位 / 已测软件与版本：
          验证：未测 / 导入通过 / 功能通过 / 视觉通过（分别记录）
          已知限制 / 回退版本：
          ```

          数量少可以先用目录加MD，无须数据库或服务器。大文件、预览、导出缓存的管理等到真实资产规模出现再决定，不提前引入复杂工具。

          ## 5. 从素材变成资产库的验收

          能找得到，知道怎么用，修改范围清楚，能重导入，坏了可恢复，来源可追溯。文件叫final_final_new不提供这些信息。资源库价值来自可靠性和一致性，不来自模型总数。

          本项目还要求：同一批资产在**统一固定机位缩略图**里摆在一起时，看起来像同一个世界。单件8分但组合后脏乱，不算合格资产库。

          ## 6. 动作复用单独处理

          先核对角色骨架、参考姿态、根位移和许可，再试一段，必要时少量裁剪/调速/过渡。动作表现、命中判定、反馈事件各有职责；武打片段只是其中一层。见D05/D06，不强迫美术基础课程承担完整动画专业训练。

          采购策略也是一样：角色尚未锁定前不囤动作。先用免费/已有动作跑通重定向与融合，再按角色和战斗节奏购买一套完整、风格一致的动作包，而不是从多个作者各买一段。

          ## 7. 能力优先级

          必须会：观察与描述、对照选择、少量常用参数、影响范围、资产质量与来源验收、**场景减法与干净度判断**。知道入口即可：资产浏览器、简单UV、修改器、动作编辑面板。按需查：复杂绑定、重拓扑、手绘贴图全流程、Shader数学、动捕清理。新的真实需求出现后，再升级具体子能力为M。

          技术依据：[Blender手册](https://docs.blender.org/manual/en/latest/) · [Godot资源](https://docs.godotengine.org/en/stable/tutorials/scripting/resources.html) · [Godot重定向](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/retargeting_3d_skeletons.html)。资源入口与许可分别见 [观看与素材入口](reference-gallery.md)。
          """,
          }
          '''
          # Remove workflow indentation from the embedded authored file.
          practical = '\n'.join(line[10:] if line.startswith('          ') else line for line in practical.splitlines()) + '\n'
          Path('curriculum/authoring/site_practical.py').write_text(practical, encoding='utf-8')

          replace_once('tools/build_course_materials.py',
              "    # Existing practical files remain; point readers to the canonical classroom text.",
              "    practical_pages = runpy.run_path(str(AUTHOR / 'site_practical.py'))['PAGES']\n    output.update(practical_pages)\n    # Existing practical files remain; point readers to the canonical classroom text.")
          replace_once('curriculum/authoring/fixed_view_strategy.py',
              "    if 'AGENTS.md' in output:\n        output['AGENTS.md'] +=",
              "    if 'AGENTS.md' in output and '## 固定视角与套装二开基线' not in output['AGENTS.md']:\n        output['AGENTS.md'] +=")
          replace_once('curriculum/authoring/fixed_view_effects.py',
              "    if 'AGENTS.md' in output:\n        output['AGENTS.md'] +=",
              "    if 'AGENTS.md' in output and '## 固定视角效果语言' not in output['AGENTS.md']:\n        output['AGENTS.md'] +=")
          PY

          python3 tools/build_course_materials.py
          python3 tools/build_course_materials.py --check
          python3 tools/check_course_numbering.py
          python3 tools/check_lesson_delivery.py
          python3 tools/check_quality_review.py
          python3 tools/check_session_readiness.py
          python3 tools/validate_repo.py
      - name: Commit canonical source and regenerated outputs
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest = json.loads(Path('curriculum/materials-manifest.json').read_text())
          allowed = set(manifest['sha256']) | {
              'curriculum/materials-manifest.json',
              'curriculum/authoring/site_practical.py',
              'curriculum/authoring/fixed_view_strategy.py',
              'curriculum/authoring/fixed_view_effects.py',
              'tools/build_course_materials.py',
          }
          tracked = subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')
          untracked = subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          changed = {p for p in tracked + untracked if p}
          bad = changed - allowed
          if bad or any(p.startswith(('game/','blender/','web/')) for p in changed):
              raise SystemExit('Unexpected publication scope: ' + repr(sorted(bad or changed)))
          if changed:
              subprocess.run(['git','add','--',*sorted(changed)], check=True)
          print('Approved practical-stage source/output files:', len(changed))
          PY
          if git diff --cached --quiet; then exit 0; fi
          ACTUAL_HEAD=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]; then
            echo 'Concurrent main change; refusing overwrite'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: make practical stage and clean style canonical'
          git push origin HEAD:main
