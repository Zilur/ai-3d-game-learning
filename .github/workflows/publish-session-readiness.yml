name: Publish reviewed learner-session refinements
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: learner-session-publication
  cancel-in-progress: false
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-session-readiness]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout exact authorized source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply two reviewed authoring hooks without changing runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit('Unexpected source anchor in ' + path)
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          replace_once('tools/build_course_materials.py',
              'import sys\n',
              'import sys\nfrom session_coach import enrich_sessions\n')
          replace_once('tools/build_course_materials.py',
              '    enrich_review(output, by_id, ORDER, ROWS, DISPLAY)\n',
              '    enrich_review(output, by_id, ORDER, ROWS, DISPLAY)\n    enrich_sessions(output, by_id, ORDER, ROWS, DISPLAY)\n')
          replace_once('tools/validate_repo.py',
              '    reviewed = subprocess.run(',
              '    session = subprocess.run([sys.executable, str(ROOT / "tools/check_session_readiness.py")], cwd=ROOT, check=False)\n    check(session.returncode == 0, "Learner readiness and cold-start dialogue inconsistent")\n    reviewed = subprocess.run(')
          PY
          python3 tools/build_course_materials.py
          python3 tools/build_course_materials.py --check
          python3 tools/check_session_readiness.py
          python3 tools/check_lesson_delivery.py
          python3 tools/check_quality_review.py
          python3 tools/validate_repo.py
      - name: Publish only verified Markdown, manifest and reviewed hooks
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest = json.loads(Path('curriculum/materials-manifest.json').read_text())
          allowed = set(manifest['sha256']) | {'curriculum/materials-manifest.json', 'tools/build_course_materials.py', 'tools/validate_repo.py'}
          tracked = subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')
          untracked = subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          changed = {p for p in tracked + untracked if p}
          unexpected = changed - allowed
          if unexpected or any(p.startswith(('game/','blender/','web/')) for p in changed):
              raise SystemExit('Refusing unexpected writes: ' + repr(sorted(unexpected or changed)))
          if changed:
              subprocess.run(['git','add','--',*sorted(changed)], check=True)
          print('Verified authorized outputs:', len(changed))
          PY
          if git diff --cached --quiet; then exit 0; fi
          ACTUAL_HEAD=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]; then
            echo 'main changed concurrently; refusing overwrite'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: publish 47 self-contained session starts, preview guidance and transfer checks'
          git push origin HEAD:main
          git rev-parse HEAD
