name: Temporary question source audit
on:
  push:
    branches: [course/reasoned-questions-20260918]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply only reviewed exact-byte changes
        run: python3 tools/_apply_question_review.py
      - name: Check all course and source contracts
        run: python3 tools/check.py
      - name: Commit only the validated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add tools/tests/test_question_design.py
          git diff --cached --check
          git commit -m 'feat(course): teach evidence-based questions and calibrate practice difficulty'
          git push origin HEAD:refs/heads/course/reasoned-questions-20260918
