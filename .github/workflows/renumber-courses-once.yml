name: Unify authorized course numbering
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: course-numbering-once
  cancel-in-progress: false
jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[unify-course-numbering]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout the exact authorized source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Migrate source IDs and colliding filenames, then validate
        run: python3 tools/migrate_course_ids.py
      - name: Publish only validated course changes
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')
          untracked = subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          changed = {p for p in tracked + untracked if p}
          for p in changed:
              if p.startswith(('.github/', 'openmaic/vendor/')) or Path(p).suffix not in {'.py','.md','.json'}:
                  raise SystemExit('Unexpected write scope: ' + p)
              if p.startswith(('game/','blender/','web/')) and not p.endswith('.md'):
                  raise SystemExit('Runtime modification refused: ' + p)
          subprocess.run(['git','add','-A','--',*sorted(changed)], check=True)
          print('Validated migration paths:', len(changed))
          PY
          if git diff --cached --quiet; then exit 0; fi
          ACTUAL_HEAD=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]; then
            echo 'main changed concurrently; do not overwrite'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'course: unify all lesson filenames, sources, questions and navigation as sequential A01-E07 groups'
          git push origin HEAD:main
          git rev-parse HEAD
