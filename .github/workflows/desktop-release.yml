name: Detached desktop release checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve authored text bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official pinned runtime and matching release templates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/install_godot_desktop_ci.py
          python tools/install_export_templates_ci.py
      - name: Linux software renderer and system CJK fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri fonts-noto-cjk
      - name: macOS system CJK font for minimal test image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$HOME/Library/Fonts"
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -o "$HOME/Library/Fonts/NotoSansCJKsc-Regular.otf"
      - name: Check private workspaces and all lesson modes
        shell: bash
        run: |
          python tools/build_course_materials.py --check
          python -m unittest discover -s tools -p 'test_polish.py' -v
      - name: Build release, detach from sources and test saved progress
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ runner.os }}" = "Linux" ]; then EXTRA="--render"; fi
          python tools/build_desktop_export.py --godot "$GODOT_BINARY" $EXTRA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: standalone-${{ runner.os }}
          path: |
            build/desktop/*/Starlight-*.zip
            build/desktop/*/SHA256.json
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: standalone-evidence-${{ runner.os }}
          path: build/desktop/*/evidence
          retention-days: 14
