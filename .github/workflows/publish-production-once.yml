name: One-time validated production integration
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publish:
    if: "github.event.head_commit.message == 'chore: publish validated production integration'"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Apply only approved source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_production_once.py apply
      - name: Build original ready assets and authored course outputs
        run: |
          python3 tools/build_world_assets.py
          python3 tools/build_course_materials.py
      - name: Validate source, resources and family tools
        run: |
          python3 tools/validate_repo.py
          python3 tools/check_learning_pathway.py
          python3 tools/check_practical_labs.py
          python3 tools/check_production.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Install pinned official Godot
        run: python3 tools/install_godot_ci.py
      - name: Execute original and new suites and cross-process saves
        run: python3 tools/run_production_checks.py
      - name: Publish exact tested files, only while main is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_production_once.py publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-publication-evidence
          path: build/production-evidence
          retention-days: 7
