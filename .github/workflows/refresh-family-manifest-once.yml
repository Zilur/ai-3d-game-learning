name: One-time family author manifest refresh
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  refresh:
    if: github.event.head_commit.message == 'chore: refresh family manifest once'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Regenerate and validate; allow only the expected manifest change
        run: |
          python3 tools/build_course_materials.py
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert changed == ['curriculum/materials-manifest.json'], changed
          PY
          python3 tools/validate_repo.py
          python3 tools/check_learning_pathway.py
          python3 tools/family_learning.py check
          python3 -m unittest discover -s tools -p 'test_family_learning.py' -v
      - name: Publish only the regenerated manifest, without altering any other path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          base = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def request(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method='GET' if payload is None else 'PUT')
              with urllib.request.urlopen(req, timeout=30) as result:
                  return json.load(result)
          assert request('/git/ref/heads/main')['object']['sha'] == os.environ['GITHUB_SHA'], 'main moved; refusing stale refresh'
          path = 'curriculum/materials-manifest.json'
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path], text=True).strip()
          result = request('/contents/' + path, {'message': 'chore: regenerate manifest for family author source', 'branch': 'main', 'sha': sha, 'content': base64.b64encode(pathlib.Path(path).read_bytes()).decode()})
          print('Published validated manifest commit:', result['commit']['sha'])
          PY
