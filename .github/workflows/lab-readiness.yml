name: Practical lab readiness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate ready-file routing and reject invalid fixtures
        run: |
          python3 tools/check_practical_labs.py
          python3 -m unittest discover -s tools -p 'test_practical_labs.py' -v
      - name: Install pinned Godot with official digest
        run: python3 tools/install_godot_ci.py
      - name: Import ready project and test interactions
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path game --editor --import 2>&1 | tee import-check.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' import-check.log; then exit 1; fi
          timeout 90 godot --headless --audio-driver Dummy --path game --fixed-fps 60 --script res://tests/practical_labs.gd 2>&1 | tee practical-check.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' practical-check.log; then exit 1; fi
          grep -q 'PRACTICAL LAB PASS' practical-check.log
      - name: Install pinned Blender with official checksum
        run: python3 tools/install_blender_ci.py
      - name: Reopen committed Blender files without silently rebuilding them
        run: |
          set -euo pipefail
          blender --background --python-exit-code 1 --python blender/labs/build_practical_labs.py -- --verify-only 2>&1 | tee blender-check.log
          grep -q 'BLENDER PRACTICAL PASS' blender-check.log
      - name: Package the tested public source and ready assets
        run: git archive HEAD --format=zip --output=ready-project.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-ready-project
          path: ready-project.zip
          retention-days: 7
