name: Temporary learner experience source review
on:
  push:
    branches: [course/learner-experience-20260918]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked public sources only
        shell: bash
        run: |
          mkdir -p build/source-review
          git archive --format=zip --output=build/source-review/source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: course-review-source
          path: build/source-review/source.zip
          retention-days: 1
