name: Retire requested Linux experience packages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-linux-experience.yml']
permissions:
  contents: read
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Remove only standalone-Linux artifacts, never evidence or other platforms
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYCODE'
          import json, os, time, urllib.request, urllib.error
          repo = os.environ['REPOSITORY']
          assert repo == 'Zilur/ai-3d-game-learning'
          base = f'https://api.github.com/repos/{repo}/actions'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'course-platform-retirement'}
          def read(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  return json.load(response)
          # The preceding bootstrap commit could still be running the old release matrix.
          for attempt in range(36):
              if read(base + '/runs/35171505695')['status'] == 'completed':
                  break
              time.sleep(5)
          else:
              raise RuntimeError('Previous release still running; refuse an incomplete cleanup')
          matches = []
          for page in range(1, 11):
              items = read(base + f'/artifacts?name=standalone-Linux&per_page=100&page={page}')['artifacts']
              matches.extend(a for a in items if a['name'] == 'standalone-Linux')
              if len(items) < 100:
                  break
          else:
              raise RuntimeError('Too many artifacts; review scope before deletion')
          for item in matches:
              ident = item['id']
              assert isinstance(ident, int) and ident > 0
              url = base + f'/artifacts/{ident}'
              current = read(url)
              assert current['id'] == ident and current['name'] == 'standalone-Linux'
              with urllib.request.urlopen(urllib.request.Request(url, method='DELETE', headers=headers), timeout=30) as response:
                  assert response.status == 204
              print(f'{ident}: retired standalone-Linux')
          remaining = read(base + '/artifacts?name=standalone-Linux&per_page=100')['artifacts']
          assert not any(a['name'] == 'standalone-Linux' for a in remaining)
          print('LINUX EXPERIENCE RETIREMENT PASS; Mac/Windows, evidence, source and learner data untouched')
          PYCODE
